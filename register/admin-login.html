<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand&display=swap');
    *{box-sizing:border-box;font-family: 'Quicksand', sans-serif;}
    body{
      background-image:url(https://raw.githubusercontent.com/CiurescuP/LogIn-Form/main/bg.jpg);
      min-height:100vh;
      background-size:cover;
      display:flex;
      align-items:center;
      justify-content:center;
      margin:0;
    }
    .card{
      width:450px;
      background:rgba(255,255,255,0.13);
      border-radius:17px;
      padding:20px;
      border:5px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(5px);
      box-shadow:0 0 40px rgba(255,0,0,0.5);
      color:#fff;
    }
    h2{text-align:center;margin:6px 0 18px;font-size:32px}
    label{display:block;margin-top:12px;font-weight:700}
    input{
      width:100%;
      padding:10px;
      border-radius:6px;
      border:2px solid #38363654;
      background:rgba(0,0,0,0.22);
      color:#fff;
      margin-top:8px;
    }
    .btn{
      margin-top:18px;
      padding:10px;
      border-radius:6px;
      width:100%;
      background:rgba(0,0,0,0.22);
      border:2px solid #38363654;
      color:#fff;
      font-weight:700;
      cursor:pointer;
    }
    .msg{
      margin-top:12px;
      padding:8px;
      border-radius:6px;
      display:none;
    }
    .msg.error{
      background:#ff4d4d;
      color:#fff;
    }
    .msg.success{
      background:#2bb673;
      color:#fff;
    }
    .back-link {
      text-align: center;
      margin-top: 15px;
    }
    .back-link a {
      color: #fff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Admin Login</h2>
    
    <label for="admin-username">Admin nomi</label>
    <input id="admin-username" type="text" placeholder="Admin username" />

    <label for="admin-pass">Parol</label>
    <input id="admin-pass" type="password" placeholder="Admin password" />

    <button id="btn-admin-login" class="btn">Admin Login</button>
    
    <div id="message" class="msg"></div>
    
    <div class="back-link">
      <a href="login.html">Foydalanuvchi loginiga qaytish</a>
    </div>
  </div>

  <script>
    // --- Helpers ---
    function showMsg(text, type = 'error') {
      const msgEl = document.getElementById('message');
      msgEl.textContent = text;
      msgEl.className = 'msg ' + (type === 'error' ? 'error' : 'success');
      msgEl.style.display = 'block';
    }
    function hideMsg() {
      document.getElementById('message').style.display = 'none';
    }

    // --- Admin Login ---
    document.getElementById('btn-admin-login').addEventListener('click', async (e) => {
      e.preventDefault();
      hideMsg();

      const username = document.getElementById('admin-username').value.trim();
      const pass = document.getElementById('admin-pass').value;

      if (!username || !pass) {
        showMsg('Iltimos barcha maydonlarni toʻldiring.');
        return;
      }

      // Admin ma'lumotlarini tekshirish
      // Bu yerda oddiy tekshirish, real loyihada server tomonida tekshirish kerak
      if (username === 'admin' && pass === '2ixcxgwy') {
        // Muvaffaqiyatli login
        localStorage.setItem('adminLoggedIn', 'true');
        localStorage.setItem('adminLoginTime', new Date().toISOString());
        location.href = 'admin.html';
      } else {
        showMsg('Admin nomi yoki parol notoʻgʻri.');
      }
    });
  </script>
</body>
</html>

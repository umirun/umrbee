<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Panel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Quicksand&display=swap');
    *{
      box-sizing:border-box;
      font-family: 'Quicksand', sans-serif;
      margin: 0;
      padding: 0;
    }
    body{
      background-color: #f5f5f5;
      min-height: 100vh;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
    }
    .logout-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background-color: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .stat-card h3 {
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .stat-card .number {
      font-size: 36px;
      font-weight: bold;
      color: #3498db;
    }
    .users-table {
      background-color: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .table-header {
      background-color: #3498db;
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #f2f2f2;
      font-weight: bold;
    }
    tr:hover {
      background-color: #f5f5f5;
    }
    .action-btn {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
      margin-right: 5px;
    }
    .delete-btn {
      background-color: #e74c3c;
    }
    .filter {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .filter input, .filter select {
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ddd;
    }
    .filter button {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
    }
    .no-data {
      text-align: center;
      padding: 20px;
      color: #7f8c8d;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Admin Panel</div>
    <button class="logout-btn" id="logout-btn">Chiqish</button>
  </header>

  <div class="container">
    <div class="stats">
      <div class="stat-card">
        <h3>Jami foydalanuvchilar</h3>
        <div class="number" id="total-users">0</div>
      </div>
      <div class="stat-card">
        <h3>Oxirgi 24 soatda kirganlar</h3>
        <div class="number" id="recent-users">0</div>
      </div>
      <div class="stat-card">
        <h3>Jami kirishlar soni</h3>
        <div class="number" id="total-logins">0</div>
      </div>
    </div>

    <div class="filter">
      <input type="text" id="search-input" placeholder="Email bo'yicha qidirish...">
      <select id="filter-select">
        <option value="all">Barchasi</option>
        <option value="today">Bugun kirganlar</option>
        <option value="week">Oxirgi haftada kirganlar</option>
        <option value="month">Oxirgi oyda kirganlar</option>
      </select>
      <button id="filter-btn">Filtrlash</button>
    </div>

    <div class="users-table">
      <div class="table-header">
        <h2>Foydalanuvchilar ro'yxati</h2>
        <button id="refresh-btn" class="action-btn">Yangilash</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Ro'yxatdan o'tgan sana</th>
            <th>Oxirgi kirish</th>
            <th>Kirishlar soni</th>
            <th>Amallar</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <!-- Foydalanuvchilar ma'lumotlari JavaScript orqali yuklanadi -->
        </tbody>
      </table>
      <div id="no-data" class="no-data" style="display: none;">
        <p>Ma'lumot topilmadi</p>
      </div>
    </div>
  </div>

  <script>
    // Admin login tekshiruvi
    if (localStorage.getItem('adminLoggedIn') !== 'true') {
      location.href = 'admin-login.html';
    }

    // Chiqish tugmasi
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('adminLoggedIn');
      localStorage.removeItem('adminLoginTime');
      location.href = 'admin-login.html';
    });

    // Foydalanuvchilar ma'lumotlarini olish
    function getUsers() {
      try {
        return JSON.parse(localStorage.getItem('users') || '[]');
      } catch (e) {
        return [];
      }
    }

    // Login tarixini olish
    function getLoginHistory() {
      try {
        return JSON.parse(localStorage.getItem('loginHistory') || '{}');
      } catch (e) {
        return {};
      }
    }

    // Foydalanuvchilar jadvalini yangilash
    function updateUsersTable(filter = 'all', searchTerm = '') {
      const users = getUsers();
      const loginHistory = getLoginHistory();
      const tbody = document.getElementById('users-tbody');
      const noData = document.getElementById('no-data');
      
      // Filtrlash
      let filteredUsers = users;
      
      if (searchTerm) {
        filteredUsers = filteredUsers.filter(user => 
          user.email.toLowerCase().includes(searchTerm.toLowerCase())
        );
      }
      
      if (filter === 'today') {
        const today = new Date().toDateString();
        filteredUsers = filteredUsers.filter(user => {
          const lastLogin = loginHistory[user.email];
          return lastLogin && new Date(lastLogin).toDateString() === today;
        });
      } else if (filter === 'week') {
        const weekAgo = new Date();
        weekAgo.setDate(weekAgo.getDate() - 7);
        filteredUsers = filteredUsers.filter(user => {
          const lastLogin = loginHistory[user.email];
          return lastLogin && new Date(lastLogin) >= weekAgo;
        });
      } else if (filter === 'month') {
        const monthAgo = new Date();
        monthAgo.setMonth(monthAgo.getMonth() - 1);
        filteredUsers = filteredUsers.filter(user => {
          const lastLogin = loginHistory[user.email];
          return lastLogin && new Date(lastLogin) >= monthAgo;
        });
      }
      
      // Jadvalni tozalash
      tbody.innerHTML = '';
      
      if (filteredUsers.length === 0) {
        noData.style.display = 'block';
        return;
      } else {
        noData.style.display = 'none';
      }
      
      // Foydalanuvchilarni jadvalga qo'shish
      filteredUsers.forEach((user, index) => {
        const row = document.createElement('tr');
        
        const loginCount = parseInt(localStorage.getItem(`loginCount_${user.email}`) || '1');
        const lastLogin = loginHistory[user.email] || 'Ma\'lumot yo\'q';
        
        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${user.email}</td>
          <td>${new Date(user.created).toLocaleString()}</td>
          <td>${new Date(lastLogin).toLocaleString()}</td>
          <td>${loginCount}</td>
          <td>
            <button class="action-btn view-btn" data-email="${user.email}">Ko'rish</button>
            <button class="action-btn delete-btn" data-email="${user.email}">O'chirish</button>
          </td>
        `;
        
        tbody.appendChild(row);
      });
      
      // Statistikani yangilash
      updateStats();
    }

    // Statistikani yangilash
    function updateStats() {
      const users = getUsers();
      const loginHistory = getLoginHistory();
      
      // Jami foydalanuvchilar
      document.getElementById('total-users').textContent = users.length;
      
      // Oxirgi 24 soatda kirganlar
      const dayAgo = new Date();
      dayAgo.setDate(dayAgo.getDate() - 1);
      const recentUsers = users.filter(user => {
        const lastLogin = loginHistory[user.email];
        return lastLogin && new Date(lastLogin) >= dayAgo;
      });
      document.getElementById('recent-users').textContent = recentUsers.length;
      
      // Jami kirishlar soni
      let totalLogins = 0;
      users.forEach(user => {
        totalLogins += parseInt(localStorage.getItem(`loginCount_${user.email}`) || '1');
      });
      document.getElementById('total-logins').textContent = totalLogins;
    }

    // Foydalanuvchini ko'rish
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('view-btn')) {
        const email = e.target.getAttribute('data-email');
        const users = getUsers();
        const user = users.find(u => u.email === email);
        
        if (user) {
          const loginHistory = getLoginHistory();
          const lastLogin = loginHistory[user.email] || 'Ma\'lumot yo\'q';
          const loginCount = localStorage.getItem(`loginCount_${user.email}`) || '1';
          
          alert(`
            Foydalanuvchi ma'lumotlari:
            Email: ${user.email}
            Ro'yxatdan o'tgan sana: ${new Date(user.created).toLocaleString()}
            Oxirgi kirish: ${new Date(lastLogin).toLocaleString()}
            Kirishlar soni: ${loginCount}
          `);
        }
      }
    });

    // Foydalanuvchini o'chirish
    document.addEventListener('click', (e) => {
      if (e.target.classList.contains('delete-btn')) {
        if (confirm('Ushbu foydalanuvchini ochirishga ishonchingiz komilmi?')) {
          const email = e.target.getAttribute('data-email');
          let users = getUsers();
          
          // Foydalanuvchini o'chirish
          users = users.filter(u => u.email !== email);
          localStorage.setItem('users', JSON.stringify(users));
          
          // Login tarixidan o'chirish
          const loginHistory = getLoginHistory();
          delete loginHistory[email];
          localStorage.setItem('loginHistory', JSON.stringify(loginHistory));
          
          // Login sanoni o'chirish
          localStorage.removeItem(`loginCount_${email}`);
          
          // Jadvalni yangilash
          updateUsersTable();
        }
      }
    });

    // Filtrlash
    document.getElementById('filter-btn').addEventListener('click', () => {
      const searchTerm = document.getElementById('search-input').value;
      const filter = document.getElementById('filter-select').value;
      updateUsersTable(filter, searchTerm);
    });

    // Yangilash tugmasi
    document.getElementById('refresh-btn').addEventListener('click', () => {
      updateUsersTable();
    });

    // Sahifa yuklanganda jadvalni yangilash
    updateUsersTable();
  </script>
</body>
</html>
